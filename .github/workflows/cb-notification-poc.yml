name: cb-notification-poc

# Faithful replica of coinbase/coinbase-advanced-py .github/workflows/notification.yml
# (slackapi/slack-github-action@v1.24.0, issue title interpolated into `payload`).
# Only additions: a local HTTP receiver so the posted body can be observed, and a dump step.

on:
  issues:
    types: [opened, reopened]

env:
  CHANNEL_API_FEEDBACK: ${{ vars.CHANNEL_API_FEEDBACK }}
  ON_CALL_API: ${{ vars.ON_CALL_API }}

jobs:
  checks:
    runs-on: ubuntu-latest
    outputs:
      skip: ${{ env.skip }}
    steps:
    - name: Check spam labels
      if: ${{ contains(github.event.*.labels.*.name, 'spam') }}
      run: |
        echo "skip=true" >> $GITHUB_ENV
        echo "::error:: Spam label found."

  notify:
    runs-on: ubuntu-latest
    needs: checks
    if: ${{ needs.checks.outputs.skip != 'true' }}
    steps:
    - name: Start local webhook receiver
      run: |
        cat > /tmp/recv.py <<'PY'
        import http.server
        class H(http.server.BaseHTTPRequestHandler):
            def do_POST(self):
                n = int(self.headers.get('content-length', 0))
                b = self.rfile.read(n)
                with open('/tmp/recv.body', 'ab') as f:
                    f.write(b + b'\n')
                self.send_response(200)
                self.send_header('Content-Type', 'application/json')
                self.end_headers()
                self.wfile.write(b'{"ok":true}')
            def log_message(self, *a):
                pass
        http.server.HTTPServer(('127.0.0.1', 8099), H).serve_forever()
        PY
        nohup python3 /tmp/recv.py >/tmp/recv.log 2>&1 &
        sleep 2

    - name: Set channel and mention
      run: |
        echo "channel=${{ env.CHANNEL_API_FEEDBACK }}" >> $GITHUB_ENV
        echo "mention=${{ env.ON_CALL_API }}" >> $GITHUB_ENV

    - name: Set text
      run: |
        text=$(echo "${{ vars.SLACK_TEMPLATE }}")
        text=${text//'{{event}}'/Issue ${{ env.action }}}
        text=${text//'{{author}}'/${{ env.author }}}
        text=${text//'{{url}}'/${{ env.url }}}
        text=${text//'{{mention}}'/${{ env.mention }}}
        text=${text//'{{repo}}'/${{ github.repository }}}
        text="${text//$'\r\n'/'\n'}"
        text="${text//$'\n'/'\n'}"
        echo "text=$text" >> $GITHUB_ENV
      env:
        action: ${{ github.event.action }}
        author: ${{ github.event.issue.user.login }}
        url: ${{ github.event.issue.html_url }}

    - name: Notify Slack
      uses: slackapi/slack-github-action@v1.24.0
      with:
        payload: |
          {
            "channel": "#${{ env.channel }}",
            "username": "${{ vars.WEBHOOK_USERNAME }}",
            "text": "*${{ env.title }}*\n${{ env.text }}",
            "icon_emoji": ":${{ vars.ICON_EMOJI }}:"
          }
      env:
        SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        title: ${{ github.event.issue.title }}

    - name: Dump captured webhook body
      if: always()
      run: |
        sleep 1
        echo "=== BEGIN CAPTURED BODY ==="
        cat /tmp/recv.body 2>/dev/null || echo "(nothing captured)"
        echo "=== END CAPTURED BODY ==="
        echo "=== parsed keys / text ==="
        python3 - <<'PY'
        import json
        try:
            raw = open('/tmp/recv.body','rb').read().strip()
            o = json.loads(raw)
            print("KEYS:", sorted(o.keys()))
            print("CHANNEL:", o.get("channel"))
            print("USERNAME:", o.get("username"))
            print("TEXT:", o.get("text"))
        except Exception as e:
            print("parse error:", e)
        PY
